name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Emergency-Dispatch-Priority-and-Coordination-System/Emergency-Dispatch-Priority-and-Coordination-System.slnx

      - name: Build without warnings
        run: dotnet build Emergency-Dispatch-Priority-and-Coordination-System/Emergency-Dispatch-Priority-and-Coordination-System.slnx --no-restore --warnaserror

      - name: Run automated regression suite
        run: dotnet test Emergency-Dispatch-Priority-and-Coordination-System/Emergency-Dispatch-Priority-and-Coordination-System.slnx --no-build --logger "trx;LogFileName=ci-results.trx" --results-directory TestResults

      - name: Check dependencies for known vulnerabilities
        shell: bash
        run: |
          dotnet list Emergency-Dispatch-Priority-and-Coordination-System/Emergency-Dispatch-Priority-and-Coordination-System.slnx package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "Known vulnerable packages were found."
            exit 1
          fi

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-results
          path: TestResults/*.trx
